apiVersion: apps/v1
kind: Deployment
metadata:
  name: guestbook
spec:
  replicas: 2
  selector:
    matchLabels:
      app: guestbook
  template:
    metadata:
      labels:
        app: guestbook
    spec:
      containers:
        - name: web
          image: ghcr.io/thingjae85/guestbook:v2
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5000
